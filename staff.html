<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass Staff</title>
  <script src="js/html5-qrcode.min.js"></script>
  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(16,26,46,.90);
      --line:rgba(255,255,255,.08);
      --text:#e8eefc;
      --muted:#90a0c0;
      --brand:#4f46e5;
      --teal:#14b8a6;
      --success:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --shadow:0 24px 70px rgba(0,0,0,.32);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% 0%, #1d4ed833 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 15%, #14b8a633 0%, transparent 55%),
        linear-gradient(180deg,#0b1220 0%, #0f172a 100%);
      background-attachment: fixed;
    }
    .header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11,18,32,.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header .who { display: flex; align-items: center; gap: 10px; }
    .header .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, var(--brand), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex: 0 0 auto;
      box-shadow: 0 8px 20px rgba(79,70,229,.35);
    }
    .header h2 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .header .staffname { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .logout {
      color: var(--text);
      font-size: 13px;
      text-decoration: none;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      transition: border-color .15s, background .15s;
    }
    .logout:hover { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.08); color: #fca5a5; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 8px 16px 32px; }

    .menu {
      padding: 22px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu button {
      padding: 26px 22px;
      font-size: 17px;
      font-weight: 700;
      border: 1px solid var(--line);
      border-radius: 22px;
      cursor: pointer;
      color: #fff;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      transition: transform .12s, filter .15s;
      font-family: inherit;
    }
    .menu button:hover { filter: brightness(1.08); }
    .menu button:active { transform: scale(.985); }
    .menu button .menu-icon {
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(255,255,255,.14);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex: 0 0 auto;
    }
    .menu button .menu-text small { display: block; font-size: 12px; font-weight: 500; opacity: .8; margin-top: 2px; }
    .btn-scan { background: linear-gradient(135deg, var(--brand), #6366f1); }
    .btn-search { background: linear-gradient(135deg, #059669, var(--teal)); }
    .btn-manual { background: linear-gradient(135deg, #d97706, #f59e0b); }

    .view { display: none; padding-top: 8px; }
    .view.active { display: block; }

    #reader { width: 100%; border-radius: 18px; overflow: hidden; margin-top: 12px; border: 1px solid var(--line); }
    .back-btn {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
      font-family: inherit;
      transition: border-color .15s, background .15s;
    }
    .back-btn:hover { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      line-height: 1.6;
    }
    .panel h3 { font-size: 17px; margin-bottom: 8px; }
    .panel p { color: var(--muted); font-size: 13px; }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      margin-bottom: 14px;
      background: rgba(255,255,255,.03);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color .15s, background .15s;
    }
    .search-input::placeholder { color: #5b6b8c; }
    .search-input:focus { border-color: var(--brand); background: rgba(79,70,229,.06); }

    .result-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 10px;
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }
    .result-card .name { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .result-card .ticket { color: var(--muted); font-size: 13px; margin: 4px 0; }
    .result-card .status { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; display: inline-block; text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
    .status.unused { background: rgba(34,197,94,.15); color: #4ade80; }
    .status.used { background: rgba(148,163,184,.15); color: #94a3b8; }
    .no-matches { color: var(--muted); font-size: 13px; padding: 4px 2px; }
    .checkin-btn {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: filter .15s, transform .1s;
    }
    .checkin-btn:hover { filter: brightness(1.1); }
    .checkin-btn:active { transform: scale(.98); }
    .checkin-btn:disabled { background: #4b5563; cursor: not-allowed; }

    /* ---- Popup, mirrored 1:1 from scanner.html ---- */
    .popup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.68);padding:18px;z-index:999}
    .popup.active{display:flex}
    .popup-card{width:100%;max-width:480px;border-radius:28px;background:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);color:#0f172a;box-shadow:0 30px 90px rgba(0,0,0,.38);overflow:hidden;border:1px solid rgba(15,23,42,.08)}
    .popup-card.valid, .popup-card.used, .popup-card.invalid { /* kind now conveyed via icon badge, not a top border */ }
    .popup-head{padding:22px 22px 16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid rgba(15,23,42,.08)}
    .popup-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:0 0 auto;background:#eaffef;color:#16a34a}
    .popup-icon.warn{background:#fff7e6;color:#b45309}
    .popup-icon.bad{background:#fff1f2;color:#dc2626}
    .popup-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#64748b;margin-bottom:6px}
    .popup-title{font-size:22px;line-height:1.15;margin-bottom:6px;font-weight:800;letter-spacing:-.01em}
    .popup-subtitle{font-size:14px;color:#475569;line-height:1.5}
    .popup-body{padding:18px 22px 6px}
    .popup-actions{display:flex;gap:10px;padding:16px 22px 22px;flex-wrap:wrap}
    .popup-actions .popup-close{flex:1 1 auto}
    .popup-close {
      padding: 13px;
      background: var(--brand, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      transition: filter .15s;
    }
    .popup-close:hover { filter: brightness(1.1); }
    .popup-card.used .popup-close { background: linear-gradient(180deg,#f59e0b 0%, #d97706 100%); }
    .popup-card.invalid .popup-close { background: #fff; border: 1px solid rgba(15,23,42,.12); color: #0f172a; }
    .popup-card.valid .popup-close { background: linear-gradient(180deg,#22c55e 0%, #16a34a 100%); }

    @media (max-width: 560px) {
      .popup-head{padding:20px 18px 14px}
      .popup-body{padding:16px 18px 4px}
      .popup-actions{padding:0 18px 18px}
      .popup-title{font-size:20px}
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="who">
      <div class="brand-mark">🎟️</div>
      <div>
        <h2>Staff Panel</h2>
        <div class="staffname" id="staffNameLabel"></div>
      </div>
    </div>
    <a class="logout" href="#" onclick="logout()">Logout</a>
  </div>

  <div class="wrap">
    <!-- MAIN MENU -->
    <div class="view active" id="menuView">
      <div class="menu">
        <button class="btn-scan" onclick="openScannerPage()">
          <span class="menu-icon">📷</span>
          <span class="menu-text">SCAN QR<small>Open the camera scanner</small></span>
        </button>
        <button class="btn-search" onclick="showView('searchView')">
          <span class="menu-icon">🔍</span>
          <span class="menu-text">SEARCH TICKET<small>Look up a ticket by ID</small></span>
        </button>
        <button class="btn-manual" onclick="showView('manualView')">
          <span class="menu-icon">✍️</span>
          <span class="menu-text">MANUAL CHECK-IN<small>Check in without scanning</small></span>
        </button>
      </div>
    </div>

    <!-- SCAN VIEW -->
    <div class="view" id="scanView">
      <button class="back-btn" onclick="showView('menuView')">← Back</button>
      <div class="panel">
        <h3>Scanner opens in a new tab</h3>
        <p>This keeps camera access working on phones. Open the scanner, then return here for search or manual check-in.</p>
        <button class="btn-scan" style="margin-top:16px;width:100%;padding:16px 18px;border-radius:16px;border:none;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;" onclick="openScannerPage()">Open Scanner</button>
      </div>
    </div>

    <!-- SEARCH VIEW -->
    <div class="view" id="searchView">
      <button class="back-btn" onclick="showView('menuView')">← Back</button>
      <input class="search-input" id="searchInput" placeholder="Ticket ID" oninput="doSearch()">
      <div id="searchResults"></div>
    </div>

    <!-- MANUAL CHECK-IN VIEW -->
    <div class="view" id="manualView">
      <button class="back-btn" onclick="showView('menuView')">← Back</button>
      <input class="search-input" id="manualInput" placeholder="Ticket ID" oninput="doManualSearch()">
      <div id="manualResults"></div>
    </div>
  </div>

  <!-- RESULT POPUP, mirrored from scanner.html -->
  <div class="popup" id="popup">
    <div class="popup-card" id="popupCard">
      <div class="popup-head">
        <div class="popup-icon" id="popupIcon"></div>
        <div>
          <div class="popup-eyebrow" id="popupEyebrow"></div>
          <div class="popup-title" id="popupTitle"></div>
          <div class="popup-subtitle" id="popupLine2"></div>
        </div>
      </div>
      <div class="popup-body">
        <p id="popupLine1" style="font-size:14px;color:#334155;font-variant-numeric:tabular-nums;word-break:break-word;"></p>
      </div>
      <div class="popup-actions">
        <button class="popup-close" onclick="closePopup()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let staffName = '';
    let html5QrCode = null;

    window.onload = function() {
      staffName = sessionStorage.getItem('ep_name');
      const role = sessionStorage.getItem('ep_role');
      if (!staffName || (role !== 'Staff' && role !== 'Admin' && role !== 'Super Admin')) {
        location.href = 'index.html';
        return;
      }
      document.getElementById('staffNameLabel').textContent = staffName;
    };

    function logout() {
      sessionStorage.clear();
      location.href = 'index.html';
    }

    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function openScannerPage() {
      // scanner.html is a separate GitHub Pages file (deployed alongside this one).
      // It talks to the Apps Script API directly via its own ?api= param.
      const scannerUrl = 'scanner.html';
      const api = getApiUrl();
      const staff = sessionStorage.getItem('ep_name') || '';
      const back = 'staff.html';

      const url = scannerUrl
        + '?api=' + encodeURIComponent(api)
        + '&staff=' + encodeURIComponent(staff)
        + '&back=' + encodeURIComponent(back)
        + '&gate=' + encodeURIComponent('Scanner');

      location.href = url;
    }

    // ---------- IN-PAGE SCANNER (fallback; normally unused since
    // "SCAN QR" opens scanner.html in-place via openScannerPage()) ----------
    async function startScanner() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("This browser doesn't support camera access.");
          return;
        }

        if (html5QrCode) {
          try { await html5QrCode.stop(); } catch (e) {}
          try { await html5QrCode.clear(); } catch (e) {}
          html5QrCode = null;
        }

        html5QrCode = new Html5Qrcode("reader");

        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) {
          alert("No camera found.");
          return;
        }

        const back =
          cameras.find(c => /back|rear|environment/i.test(c.label));
        const cameraId = back ? back.id : cameras[0].id;

        await html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: 250,
            aspectRatio: 1.0
          },
          onScanSuccess,
          () => {}
        );

      } catch (err) {
        console.error(err);
        alert(
          "Camera permission was denied or blocked.\n\n" +
          "If you're using an in-app browser, open this page in Chrome or Safari."
        );
      }
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(()=>{});
      }
    }

    let lastScanned = '';
    let scanLock = false;
    function extractTicketId(qrText) {
      const parts = String(qrText || '').split('|').map(p => p.trim());
      return parts[2] || parts[0] || '';
    }

    function onScanSuccess(decodedText) {
      if (scanLock || decodedText === lastScanned) return;
      scanLock = true;
      lastScanned = decodedText;
      stopScanner();
      submitCheckIn(extractTicketId(decodedText), null);
      setTimeout(() => { scanLock = false; }, 2000);
    }

    // ---------- CHECK-IN SUBMISSION ----------
    async function submitCheckIn(ticketId, gateLabel) {
      const res = await api('checkIn', { ticketId, staffName, gateLabel });
      showResult(res);
    }

    function showResult(res) {
      const popup = document.getElementById('popup');
      const card = document.getElementById('popupCard');
      const icon = document.getElementById('popupIcon');
      const eyebrow = document.getElementById('popupEyebrow');
      const title = document.getElementById('popupTitle');
      const l1 = document.getElementById('popupLine1');
      const l2 = document.getElementById('popupLine2');

      card.className = 'popup-card';
      icon.className = 'popup-icon';
      if (res.status === 'VALID') {
        card.classList.add('valid');
        icon.textContent = '✓';
        eyebrow.textContent = 'CHECK-IN SUCCESSFUL';
        title.textContent = 'Valid Ticket';
        l1.textContent = res.ticketId;
        l2.textContent = 'Checked in at ' + res.checkedInTime;
      } else if (res.status === 'ALREADY_USED') {
        card.classList.add('used');
        icon.classList.add('warn');
        icon.textContent = '⚠';
        eyebrow.textContent = 'ALREADY USED';
        title.textContent = 'Already Used';
        l1.textContent = res.ticketId;
        l2.textContent = 'Checked in at ' + res.checkedInTime + ' · By ' + res.checkedInBy;
      } else {
        card.classList.add('invalid');
        icon.classList.add('bad');
        icon.textContent = '❌';
        eyebrow.textContent = 'INVALID TICKET';
        title.textContent = 'Invalid Ticket';
        l1.textContent = res.error || 'Ticket ID not recognized.';
        l2.textContent = '';
      }
      popup.classList.add('active');
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
      showView('menuView');
      // Refresh search views if returning to them
      document.getElementById('searchResults').innerHTML = '';
      document.getElementById('manualResults').innerHTML = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('manualInput').value = '';
    }

    // ---------- SEARCH (view only) ----------
    let searchDebounce;
    function doSearch() {
      clearTimeout(searchDebounce);
      const q = document.getElementById('searchInput').value;
      if (q.length < 2) { document.getElementById('searchResults').innerHTML = ''; return; }
      searchDebounce = setTimeout(async () => {
        const res = await api('searchGuest', { query: q });
        renderSearchResults(res.success ? res.data : []);
      }, 300);
    }

    function renderSearchResults(results) {
      const container = document.getElementById('searchResults');
      if (!results.length) { container.innerHTML = '<p class="no-matches">No matches.</p>'; return; }
      container.innerHTML = results.map(g => `
        <div class="result-card">
          <div class="name">${g['Ticket ID']}</div>
          <span class="status ${g.Status === 'Used' ? 'used' : 'unused'}">${g.Status}</span>
        </div>
      `).join('');
    }

    // ---------- MANUAL CHECK-IN ----------
    let manualDebounce;
    function doManualSearch() {
      clearTimeout(manualDebounce);
      const q = document.getElementById('manualInput').value;
      if (q.length < 2) { document.getElementById('manualResults').innerHTML = ''; return; }
      manualDebounce = setTimeout(async () => {
        const res = await api('searchGuest', { query: q });
        renderManualResults(res.success ? res.data : []);
      }, 300);
    }

    function renderManualResults(results) {
      const container = document.getElementById('manualResults');
      if (!results.length) { container.innerHTML = '<p class="no-matches">No matches.</p>'; return; }
      container.innerHTML = results.map(g => `
        <div class="result-card">
          <div class="name">${g['Ticket ID']}</div>
          <span class="status ${g.Status === 'Used' ? 'used' : 'unused'}">${g.Status}</span>
          ${g.Status !== 'Used' ? `<button class="checkin-btn" onclick="manualCheckInGuest('${g['Ticket ID']}')">CHECK IN</button>` : ''}
        </div>
      `).join('');
    }

    async function manualCheckInGuest(ticketId) {
      const res = await api('manualCheckIn', { ticketId, staffName });
      showResult(res);
    }
  </script>
</body>
</html>
