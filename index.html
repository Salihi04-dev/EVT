<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventPass Lite — Sign In</title>
  <script>
    // Applied before paint so there's no flash of the wrong theme.
    (function () {
      const saved = localStorage.getItem('ep_theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <style>
    :root{
      --bg:#0b1220;
      --bg-grad:
        radial-gradient(900px 500px at 10% 0%, #1d4ed833 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 15%, #14b8a633 0%, transparent 55%),
        linear-gradient(180deg,#0b1220 0%, #0f172a 100%);
      --text:#e8eefc;
      --muted:#90a0c0;
      --brand:#4f46e5;
      --teal:#14b8a6;
      --line:rgba(255,255,255,.08);
      --chip-bg:rgba(255,255,255,.04);
      /* Sign-in card mirrors scanner.html's popup-card: light surface in both themes */
      --card-bg:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);
      --card-text:#0f172a;
      --card-muted:#64748b;
      --card-line:rgba(15,23,42,.08);
      --card-line-strong:rgba(15,23,42,.12);
      --card-shadow:0 30px 90px rgba(0,0,0,.38);
      --input-bg:#fff;
      --placeholder:#94a3b8;
      color-scheme: dark;
    }
    [data-theme="light"]{
      --bg:#eef1f7;
      --bg-grad:
        radial-gradient(900px 500px at 10% 0%, #4f46e51f 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 15%, #14b8a61f 0%, transparent 55%),
        linear-gradient(180deg,#eef1f7 0%, #e6eaf4 100%);
      --text:#0f172a;
      --muted:#5b6b8c;
      --line:rgba(15,23,42,.09);
      --chip-bg:rgba(15,23,42,.05);
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-grad);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      transition: background .25s ease, color .25s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px; height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--text);
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s, transform .1s;
      backdrop-filter: blur(10px);
    }
    .theme-toggle:hover { border-color: rgba(79,70,229,.5); }
    .theme-toggle:active { transform: scale(.92); }

    .eyebrow-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .brand-mark {
      width: 58px; height: 58px; border-radius: 18px;
      background: linear-gradient(135deg, var(--brand), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 12px 30px rgba(79,70,229,.4);
    }
    .eyebrow-mark small {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 700;
    }

    .card {
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 28px;
      padding: 34px 28px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-line);
    }
    .logo { text-align: center; margin-bottom: 26px; }
    .logo h1 { font-size: 22px; color: var(--card-text); font-weight: 800; letter-spacing: -.01em; }
    .logo p { color: var(--card-muted); font-size: 13px; margin-top: 6px; }
    label {
      display: block; font-size: 11px; font-weight: 700; color: var(--card-muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: 6px; margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--card-line-strong);
      border-radius: 12px; font-size: 15px; outline: none; transition: border-color 0.2s, background .2s;
      background: var(--input-bg); color: var(--card-text); font-family: inherit;
    }
    input::placeholder { color: var(--placeholder); }
    input:focus { border-color: var(--brand); }
    button {
      width: 100%; margin-top: 26px; padding: 14px; background: var(--brand);
      color: #fff; border: none; border-radius: 14px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: filter 0.15s, transform .1s;
      font-family: inherit;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(.98); }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,.1); color: #dc2626; padding: 11px 14px;
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 12px; font-size: 13px; margin-top: 16px; display: none;
    }
    .spinner { display: none; text-align: center; margin-top: 14px; color: var(--card-muted); font-size: 13px; }
    .spinner .dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--brand); margin-right: 6px; vertical-align: -1px;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{ opacity:.3 } 50%{ opacity:1 } }

    @media (max-width: 420px) {
      .card { padding: 28px 20px 24px; border-radius: 24px; }
      .brand-mark { width: 50px; height: 50px; font-size: 24px; }
    }
  
/* EventPass Light UI — visual layer only. Existing markup, IDs, handlers and auth logic are untouched. */
:root,
[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f7fb;
  --bg-grad:
    radial-gradient(900px 600px at 6% 4%, rgba(85,77,232,.16) 0%, transparent 55%),
    radial-gradient(760px 540px at 100% 92%, rgba(10,167,122,.13) 0%, transparent 54%),
    linear-gradient(135deg, #f8fafc 0%, #eef3f8 100%);
  --text: #16263f;
  --muted: #6f8096;
  --brand: #554de8;
  --teal: #0aa77a;
  --line: #dce4ee;
  --chip-bg: rgba(255,255,255,.76);
  --card-bg: linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(250,252,255,.98) 100%);
  --card-text: #14243d;
  --card-muted: #6d7d92;
  --card-line: #dbe5ef;
  --card-line-strong: #ccd8e5;
  --card-shadow: 0 28px 80px rgba(26,43,72,.14), 0 8px 24px rgba(26,43,72,.06);
  --input-bg: #fbfcfe;
  --placeholder: #a0adbb;
}

html { background: #f4f7fb; }
body {
  color: var(--text);
  background: var(--bg-grad);
  background-attachment: fixed;
}
.theme-toggle { display: none !important; }

body > div {
  width: min(100%, 410px);
  position: relative;
  z-index: 1;
}
body::before {
  content: '';
  position: fixed;
  width: 420px; height: 420px;
  left: -210px; bottom: -230px;
  border-radius: 50%;
  background: rgba(85,77,232,.06);
  filter: blur(8px);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  width: 300px; height: 300px;
  right: -170px; top: -140px;
  border-radius: 50%;
  background: rgba(10,167,122,.07);
  filter: blur(8px);
  pointer-events: none;
}

.eyebrow-mark { gap: 12px; margin-bottom: 18px; }
.brand-mark {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, #625bf0 0%, #3f45b8 100%);
  box-shadow: 0 16px 34px rgba(85,77,232,.22), inset 0 1px 0 rgba(255,255,255,.20);
  border: 1px solid rgba(255,255,255,.72);
}
.eyebrow-mark small {
  color: #718198;
  font-size: 10px;
  letter-spacing: .20em;
}

.card {
  border: 1px solid var(--card-line);
  border-radius: 24px;
  padding: 34px 30px 30px;
  box-shadow: var(--card-shadow);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 4px;
  background: linear-gradient(90deg, #5d57ee, #18a97f);
}
.logo { margin-bottom: 26px; }
.logo h1 { color: #152640; font-size: 24px; letter-spacing: -.025em; }
.logo p { color: #718198; }
label { color: #708198; }
input {
  background: #fff;
  border-color: #ccd8e5;
  border-radius: 13px;
  box-shadow: inset 0 1px 1px rgba(22,38,63,.025);
}
input:focus {
  border-color: #655fe9;
  box-shadow: 0 0 0 4px rgba(85,77,232,.08);
}
button[type="submit"] {
  margin-top: 24px;
  background: linear-gradient(135deg, #5b55ea 0%, #433bc0 100%);
  border: 1px solid rgba(57,52,169,.25);
  box-shadow: 0 12px 22px rgba(85,77,232,.20);
  letter-spacing: .005em;
}
button[type="submit"]:hover { filter: brightness(1.04); }
.error { background: #fff2f4; color: #c4384d; border-color: #f0cbd2; }
.spinner { color: #718198; }
.spinner .dot { background: #554de8; }

@media (max-width: 420px) {
  body { padding: 16px; }
  .card { padding: 32px 22px 26px; }
}

</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle light and dark theme" title="Toggle theme">🌙</button>

  <div>
    <div class="eyebrow-mark">
      <div class="brand-mark">🎟️</div>
      <small>EventPass Lite</small>
    </div>

    <div class="card">
      <div class="logo">
        <h1>Welcome back</h1>
        <p>Sign in to continue</p>
      </div>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">

        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" id="submitBtn">Sign In</button>
      </form>

      <div class="error" id="errorBox"></div>
      <div class="spinner" id="spinner"><span class="dot"></span>Signing in…</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in, skip straight to the right dashboard.
    (function () {
      const role = sessionStorage.getItem('ep_role');
      if (role === 'Admin' || role === 'Super Admin') location.href = 'admin.html';
      else if (role === 'Staff') location.href = 'staff.html';
    })();

    syncThemeToggleIcon();

    document.getElementById('loginForm').addEventListener('submit', handleLogin);

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('errorBox');
      const spinner = document.getElementById('spinner');
      const btn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      spinner.style.display = 'block';
      btn.disabled = true;

      const res = await api('login', { email, password });

      spinner.style.display = 'none';
      btn.disabled = false;

      if (res.success) {
        sessionStorage.setItem('ep_role', res.role);
        sessionStorage.setItem('ep_name', res.name);
        sessionStorage.setItem('ep_id', res.id);

        location.href = (res.role === 'Admin' || res.role === 'Super Admin')
          ? 'admin.html'
          : 'staff.html';
      } else {
        errorBox.textContent = res.error || 'Something went wrong. Try again.';
        errorBox.style.display = 'block';
      }
    }

    // ---------- THEME ----------
    function toggleTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('ep_theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('ep_theme', 'light');
      }
      syncThemeToggleIcon();
    }

    function syncThemeToggleIcon() {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      btn.textContent = isLight ? '☀️' : '🌙';
      btn.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
    }
  </script>
</body>
</html>
